<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Book Details</h1>

<p>
    <strong>ID:</strong>
    <span th:text="${book.id}">1</span>
</p>

<p>
    <strong>Title:</strong>
    <span th:text="${book.title}">Book Title</span>
</p>

<p>
    <strong>Author:</strong>
    <span th:text="${book.author}">Author</span>
</p>

<p>
    <strong>Publication Year:</strong>
    <span th:text="${book.publicationYear}">2000</span>
</p>

<a th:href="@{/books/edit/{id}(id=${book.id})}">
    Edit Book
</a>

<br>

<a th:href="@{/books}">
    Back to Books
</a>

</body>
</html>
