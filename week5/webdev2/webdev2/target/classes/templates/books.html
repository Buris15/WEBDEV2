<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Library</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Book Library</h1>

<a th:href="@{/books/new}">Add Book</a>

<p th:if="${#lists.isEmpty(books)}">
    No books available.
</p>

<table th:if="${!#lists.isEmpty(books)}" border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Publication Year</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td>
            <a th:href="@{/books/{id}(id=${book.id})}"
               th:text="${book.title}">
                Book Title
            </a>
        </td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.publicationYear}">2000</td>
        <td>
            <a th:href="@{/books/edit/{id}(id=${book.id})}">
                Edit
            </a>

            |

            <a th:href="@{/books/delete/{id}(id=${book.id})}">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
