<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Edit Book</h1>

<form th:action="@{/books/edit/{id}(id=${book.id})}"
      th:object="${book}"
      method="post">

    <div>
        <label for="title">Title:</label>

        <input type="text"
               id="title"
               th:field="*{title}">

        <p th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">
            Title error
        </p>
    </div>

    <br>

    <div>
        <label for="author">Author:</label>

        <input type="text"
               id="author"
               th:field="*{author}">

        <p th:if="${#fields.hasErrors('author')}"
           th:errors="*{author}">
            Author error
        </p>
    </div>

    <br>

    <div>
        <label for="publicationYear">Publication Year:</label>

        <input type="number"
               id="publicationYear"
               th:field="*{publicationYear}">

        <p th:if="${#fields.hasErrors('publicationYear')}"
           th:errors="*{publicationYear}">
            Publication year error
        </p>
    </div>

    <br>

    <button type="submit">Update Book</button>
</form>

<br>

<a th:href="@{/books}">
    Back to Books
</a>

</body>
</html>
