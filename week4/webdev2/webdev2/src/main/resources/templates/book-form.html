<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Add Book</h1>

<form th:action="@{/books}"
      th:object="${book}"
      method="post">

    <div>
        <label for="title">Title:</label>
        <input type="text"
               id="title"
               th:field="*{title}">

        <p th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">
            Title error
        </p>
    </div>

    <div>
        <label for="author">Author:</label>
        <input type="text"
               id="author"
               th:field="*{author}">

        <p th:if="${#fields.hasErrors('author')}"
           th:errors="*{author}">
            Author error
        </p>
    </div>

    <button type="submit">Save Book</button>

</form>

<a th:href="@{/books}">Back to Books</a>

</body>
</html>
