<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Book Details</h1>

<h2 th:text="${book.title}">
    Book Title
</h2>

<p th:text="'Author: ' + ${book.author}">
    Author
</p>

<p th:text="'Book ID: ' + ${book.id}">
    ID
</p>

<a th:href="@{/books}">Back to Books</a>

</body>
</html>
