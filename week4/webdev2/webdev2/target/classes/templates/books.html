<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Book List</h1>

<p th:if="${#lists.isEmpty(books)}">
    No books available.
</p>

<div th:each="book : ${books}">
    <h2>
        <a th:href="@{/books/{id}(id=${book.id})}"
           th:text="${book.title}">
            Book Title
        </a>
    </h2>

    <p th:text="'Author: ' + ${book.author}">
        Author
    </p>
</div>

</body>
</html>
