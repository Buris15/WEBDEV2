<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details | Task Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container narrow">
    <a class="back-link" th:href="@{/tasks}">← Back to tasks</a>
    <section class="panel detail-panel">
        <p class="eyebrow" th:text="${'TASK #' + task.id}">TASK #1</p>
        <h1 th:text="${task.title}">Task title</h1>
        <p class="status-pill" th:classappend="${task.completed ? ' done' : ''}"
           th:text="${task.completed ? 'Completed' : 'In progress'}">In progress</p>

        <div class="detail-field">
            <h2>Description</h2>
            <p class="description" th:text="${#strings.isEmpty(task.description) ? 'No description provided.' : task.description}">Task description</p>
        </div>
        <div class="detail-field">
            <h2>Completion status</h2>
            <p th:text="${task.completed ? 'This task is completed.' : 'This task is not completed yet.'}">This task is not completed yet.</p>
        </div>
        <form th:action="@{/tasks/{id}/completion(id=${task.id})}" method="post" class="completion-form">
            <input type="hidden" name="completed" th:value="${!task.completed}">
            <input type="hidden" name="returnTo" value="detail">
            <button class="button" type="submit"
                    th:text="${task.completed ? 'Mark as in progress' : 'Mark as completed'}">Mark as completed</button>
        </form>
        <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" class="completion-form"
              onsubmit="return confirm('Are you sure you want to delete this task? This cannot be undone.');">
            <button class="button danger" type="submit">Delete task</button>
        </form>
        <a class="button secondary" th:href="@{/tasks}">Return to task list</a>
    </section>
</main>
</body>
</html>
