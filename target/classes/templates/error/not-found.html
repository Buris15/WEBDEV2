<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Not Found | Task Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container narrow">
    <section class="panel error-panel">
        <p class="eyebrow">ERROR 404</p>
        <h1>Task not found</h1>
        <p th:text="${errorMessage}">The requested task could not be found.</p>
        <p class="muted">The task may not exist or may have an invalid ID.</p>
        <a class="button" th:href="@{/tasks}">Back to tasks</a>
    </section>
</main>
</body>
</html>
