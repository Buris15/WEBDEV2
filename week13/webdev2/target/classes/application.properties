spring.application.name=pet-veterinary-clinic
server.port=8080

# The same schema is created by INFOMAN1/week13/schema.sql.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/infoman1_vetclinic_finals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL scripts own schema changes; Hibernate checks mappings instead of changing tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}

# Used only when the frontend is served from a separate local origin such as Live Server.
# When served at http://localhost:8080/ from Spring Boot itself, the browser uses same-origin requests.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5500}
